[terminal]
name = "FT"
title = "FINANCIAL TERMINAL"
timezone = ""
font = "DejaVu Sans Mono"
font_size = 11
refresh_seconds = 60
history_limit = 500

[data]
market_provider = "yahoo"
fundamentals_provider = "yahoo"
news_provider = "yahoo_rss"
macro_provider = "fred"
demo_mode = false

[data.cache]
quote_ttl_seconds = 60
price_ttl_seconds = 300
fundamental_ttl_seconds = 21600
news_ttl_seconds = 300
macro_ttl_seconds = 86400
history_days = 4000

[network]
timeout_seconds = 10
retries = 2
user_agent = "personal-financial-terminal/0.1"
offline_check_seconds = 45

[providers.fred]
api_key_env = "FRED_API_KEY"
base_url = "https://api.stlouisfed.org/fred"

[providers.alpha_vantage]
api_key_env = "ALPHA_VANTAGE_API_KEY"
base_url = "https://www.alphavantage.co/query"

[providers.yahoo]
base_url = "https://query1.finance.yahoo.com"
search_url = "https://query1.finance.yahoo.com/v1/finance/search"

[providers.rss]
feeds = [
  { name = "CNBC", url = "https://www.cnbc.com/id/100003114/device/rss/rss.html", category = "general" },
  { name = "MarketWatch", url = "https://feeds.content.dowjones.io/public/rss/mw_topstories", category = "markets" },
  { name = "Economic Times", url = "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms", category = "india" },
  { name = "BBC Business", url = "https://feeds.bbci.co.uk/news/business/rss.xml", category = "global" },
]

[session.NSE]
exchange = "NSE"
timezone = "Asia/Kolkata"
open = "09:15"
close = "15:30"
pre_open = "09:00"
post_close = "15:40"

[session.NYSE]
exchange = "NYSE"
timezone = "America/New_York"
open = "09:30"
close = "16:00"
pre_open = "04:00"
post_close = "20:00"

[session.LSE]
exchange = "LSE"
timezone = "Europe/London"
open = "08:00"
close = "16:30"
pre_open = "07:00"
post_close = "17:30"

[analytics]
risk_free_rate = 0.04
trading_days = 252
default_benchmark = "^GSPC"

[session.BSE]
exchange = "BSE"
timezone = "Asia/Kolkata"
open = "09:15"
close = "15:30"
pre_open = "09:00"
post_close = "16:00"

[markets]
indices = ["^GSPC", "^DJI", "^IXIC", "^NSEI", "^BSESN", "^FTSE", "^GDAXI", "^N225"]
headline_feeds = 3
headline_count = 8

[screener]
universe = [
  "AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA", "TSLA", "JPM", "V", "JNJ",
  "WMT", "PG", "XOM", "HD", "KO", "PEP", "MRK", "ABBV", "COST", "AVGO",
  "AMD", "NFLX", "CRM", "ORCL", "INTC", "DIS", "NKE", "CAT", "BA", "GS",
  "RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "ICICIBANK.NS", "INFY.NS", "SBIN.NS",
  "LT.NS", "ITC.NS", "BHARTIARTL.NS", "TATAMOTORS.NS",
]

[portfolio]
base_currency = "USD"

[peers]
AAPL = ["MSFT", "GOOGL", "AMZN", "META"]
MSFT = ["AAPL", "GOOGL", "AMZN", "ORCL"]
GOOGL = ["AAPL", "MSFT", "META", "AMZN"]
AMZN = ["AAPL", "MSFT", "GOOGL", "META"]
META = ["AAPL", "GOOGL", "AMZN", "NFLX"]
NVDA = ["AMD", "AVGO", "TSM", "INTC"]
TSLA = ["GM", "F", "RIVN", "NIO"]
JPM = ["BAC", "WFC", "GS", "MS"]
INFY = ["TCS", "WIPRO", "HCLTECH", "TECHM"]
TCS = ["INFY", "HCLTECH", "WIPRO", "TECHM"]
RELIANCE = ["TCS", "HDFCBANK", "ICICIBANK", "INFY"]
HDFCBANK = ["ICICIBANK", "SBIN", "AXISBANK", "KOTAKBANK"]
ICICIBANK = ["HDFCBANK", "SBIN", "AXISBANK", "KOTAKBANK"]

[macro_series]
US_CPI = { series = "CPIAUCSL", title = "US CPI", units = "Index 1982-84=100" }
US_CORE_CPI = { series = "CPILFESL", title = "US Core CPI", units = "Index 1982-84=100" }
US_PPI = { series = "PPIACO", title = "US PPI", units = "Index 1984=100" }
US_GDP = { series = "GDPC1", title = "US Real GDP", units = "Billions Chained 2017 $" }
US_UNRATE = { series = "UNRATE", title = "US Unemployment Rate", units = "Percent" }
US_FEDFUNDS = { series = "FEDFUNDS", title = "US Fed Funds Rate", units = "Percent" }
US_DGS2 = { series = "DGS2", title = "US 2Y Treasury Yield", units = "Percent" }
US_DGS5 = { series = "DGS5", title = "US 5Y Treasury Yield", units = "Percent" }
US_DGS10 = { series = "DGS10", title = "US 10Y Treasury Yield", units = "Percent" }
US_DGS30 = { series = "DGS30", title = "US 30Y Treasury Yield", units = "Percent" }
US_NFIP = { series = "PAYEMS", title = "US Nonfarm Payrolls", units = "Thousands" }
US_M2 = { series = "M2SL", title = "US M2 Money Stock", units = "Billions of Dollars" }
US_JOBLESS = { series = "ICSA", title = "US Initial Jobless Claims", units = "Thousands" }
IN_REPO = { series = "IRSTCI01INM156N", title = "India Policy Rate", units = "Percent" }
