[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-financial-terminal"
version = "0.1.0"
description = "Private single-user keyboard-first financial research terminal"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15",
    "keyring>=25",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
terminal = "app.main:main"
financial-terminal = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "data*", "analytics*", "database*"]

[tool.setuptools.package-data]
"database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
